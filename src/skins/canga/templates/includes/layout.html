<roundcube:add_label name="back" />
<roundcube:add_label name="errortitle" />
<roundcube:add_label name="options" />
<roundcube:add_label name="plaintoggle" />
<roundcube:add_label name="htmltoggle" />
<roundcube:add_label name="previous" />
<roundcube:add_label name="next" />
<roundcube:add_label name="select" />
<roundcube:add_label name="close" />
<roundcube:add_label name="browse" />
<roundcube:add_label name="choosefile" />
<roundcube:add_label name="choosefiles" />
<roundcube:object name="doctype" value="html5" />
<roundcube:if condition="!env:framed || env:extwin" />
<html>
<roundcube:else />
<html class="iframe">
<roundcube:endif />
<head>
	<roundcube:object name="meta" />
	<roundcube:object name="links" />
	<roundcube:link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
	<link rel="stylesheet" href="/deps/bootstrap.min.css">
	<roundcube:if condition="config:devel_mode" />
		<link rel="stylesheet/less" href="/styles/styles.less">
		<roundcube:link rel="stylesheet/less" href="/styles/print.less" condition="env:action == 'print'" />
		<script src="/deps/less.min.js" data-env="development"></script>
	<roundcube:else />
		<link rel="stylesheet" href="/styles/styles.css">
		<roundcube:link rel="stylesheet" href="/styles/print.css" condition="env:action == 'print'" />
	<roundcube:endif />
	<roundcube:if condition="env:action != 'print' && !config:devel_mode && config:dark_mode_support" />
		<script>
		try {
			if (document.cookie.indexOf('colorMode=dark') > -1
				|| (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
			) {
				document.documentElement.className += ' dark-mode';
			}
		} catch (e) { }
		</script>
	<roundcube:endif />
</head>
<body class="task-<roundcube:exp expression="env:error_task ?: env:task ?: 'error'"> action-<roundcube:exp expression="asciiwords(env:action, true, '-') ?: 'none'">">
	<roundcube:if condition="!env:framed || env:extwin" />
		<div id="canga-topbar" class="canga-topbar" role="navigation" aria-label="Navegação superior">
			<div class="canga-topbar-inner">
				<div class="canga-topbar-menu">
					<a class="canga-topbar-trigger calendar-all" href="?_task=calendar" aria-label="Calendário">
						<span class="canga-topbar-icon" aria-hidden="true"></span>
						<span class="canga-topbar-label">Calendário</span>
					</a>
				</div>
				<div class="canga-topbar-menu canga-topbar-settings">
					<button type="button" class="canga-topbar-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Configurações">
						<span class="canga-topbar-icon" aria-hidden="true"></span>
						<span class="canga-topbar-label">Configurações</span>
						<span class="canga-topbar-caret" aria-hidden="true"></span>
					</button>
					<ul class="canga-topbar-dropdown" hidden>
						<li><a class="user-preferences" href="?_task=settings&amp;_action=plugin.user">Preferências</a></li>
						<li><a class="folders" href="?_task=settings&amp;_action=folders">Pastas</a></li>
						<li><a class="identities" href="?_task=settings&amp;_action=identities">Identidades</a></li>
						<li><a class="responses" href="?_task=settings&amp;_action=responses">Respostas</a></li>
						<li><a class="twofactor" href="?_task=settings&amp;_action=plugin.twofactor_gauthenticator">Verificação em Duas Etapas</a></li>
					</ul>
				</div>
			</div>
		</div>
		<div id="canga-pageheader" class="canga-pageheader" role="banner">
			<div class="canga-pageheader-copy">
				<div id="canga-pageheader-title" class="canga-pageheader-title"></div>
				<div id="canga-pageheader-subtitle" class="canga-pageheader-subtitle"></div>
			</div>
			<div id="canga-pageheader-actions" class="canga-pageheader-actions"></div>
		</div>
		<div id="<roundcube:exp expression="env:action == 'print' ? 'print-' : ''">layout">
	<roundcube:endif />
